<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انتهت مهلة الموقع</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: #2d3436;
    padding: 20px;
  }
  .box {
    background: #fff;
    max-width: 460px;
    width: 100%;
    text-align: center;
    padding: 48px 32px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin-bottom: 12px; color: #d63031; }
  p { font-size: 16px; line-height: 1.8; color: #636e72; }
  button {
    margin-top: 28px;
    padding: 12px 32px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #0984e3;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #0770c2; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">⏳</div>
    <h1>لقد انتهت مهلة الموقع</h1>
    <p>نحن آسفون، انتهت مهلة هذا الموقع.<br>يرجى انتظار نسخة التطبيق.</p>
  </div>
</body>
</html>
